<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0782F"/>
    </marker>
  </defs>
  <rect width="1240" height="560" fill="#F7F3EC"/>
  <text x="30" y="46" font-size="24" font-weight="700" fill="#1B2A41">Arkosa · phase gates</text>
  <text x="30" y="70" font-size="13" fill="#5B6B82">Phases unlock by client count, not date. Nothing from a later phase is built early.</text>

  <!-- phase boxes: x = 30 + i*202, w=178 -->
  <g font-size="12">
    <rect x="30" y="110" width="178" height="120" rx="8" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.5"/>
    <text x="44" y="136" font-size="15" font-weight="700" fill="#1B2A41">P0 · Foundation</text>
    <text x="44" y="160" fill="#5B6B82">Repo clean, CLAUDE.md</text>
    <text x="44" y="178" fill="#5B6B82">Demo line (Twilio)</text>
    <text x="44" y="196" fill="#5B6B82">50 CASL-documented</text>
    <text x="44" y="214" fill="#5B6B82">contacts</text>

    <rect x="232" y="110" width="178" height="120" rx="8" fill="#1B2A41"/>
    <text x="246" y="136" font-size="15" font-weight="700" fill="#fff">P1 · Never Miss</text>
    <text x="246" y="160" fill="#D9DEE7">Phone + email outreach</text>
    <text x="246" y="178" fill="#D9DEE7">Site → 30 days free</text>
    <text x="246" y="196" fill="#D9DEE7">→ day-25 report</text>
    <text x="246" y="214" fill="#F2B98C">GHL Starter at client #1</text>

    <rect x="434" y="110" width="178" height="120" rx="8" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.5"/>
    <text x="448" y="136" font-size="15" font-weight="700" fill="#1B2A41">P2 · Lead engine</text>
    <text x="448" y="160" fill="#5B6B82">Prairie Trades Report</text>
    <text x="448" y="178" fill="#5B6B82">Tender feed</text>
    <text x="448" y="196" fill="#5B6B82">Beehiiv (free tier)</text>
    <text x="448" y="214" fill="#E0782F">Decide capacity (R8)</text>

    <rect x="636" y="110" width="178" height="120" rx="8" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="650" y="136" font-size="15" font-weight="700" fill="#1B2A41">P3 · Add-ons</text>
    <text x="650" y="160" fill="#5B6B82">Tender alerts pro</text>
    <text x="650" y="178" fill="#5B6B82">Social content</text>
    <text x="650" y="196" fill="#5B6B82">Pitch at month-3</text>
    <text x="650" y="214" fill="#5B6B82">review</text>

    <rect x="838" y="110" width="178" height="120" rx="8" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="852" y="136" font-size="15" font-weight="700" fill="#1B2A41">P4 · Books</text>
    <text x="852" y="160" fill="#5B6B82">Partner bookkeeper</text>
    <text x="852" y="178" fill="#5B6B82">Dext/Hubdoc + QBO</text>
    <text x="852" y="196" fill="#5B6B82">↔ CRM</text>

    <rect x="1040" y="110" width="178" height="120" rx="8" fill="#FFFFFF" stroke="#5B6B82" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1054" y="136" font-size="15" font-weight="700" fill="#1B2A41">P5 · Expand</text>
    <text x="1054" y="160" fill="#5B6B82">Contractor first</text>
    <text x="1054" y="178" fill="#5B6B82">Plumbing → Regina</text>
    <text x="1054" y="196" fill="#5B6B82">→ US (TCPA/10DLC)</text>
    <text x="1054" y="214" fill="#5B6B82">GHL SaaS mode?</text>
  </g>

  <!-- arrows between phases -->
  <g stroke="#1B2A41" stroke-width="1.8">
    <line x1="208" y1="170" x2="229" y2="170" marker-end="url(#a)"/>
    <line x1="410" y1="170" x2="431" y2="170" marker-end="url(#a)"/>
    <line x1="612" y1="170" x2="633" y2="170" marker-end="url(#a)"/>
    <line x1="814" y1="170" x2="835" y2="170" marker-end="url(#a)"/>
    <line x1="1016" y1="170" x2="1037" y2="170" marker-end="url(#a)"/>
  </g>

  <!-- gate labels row -->
  <text x="30" y="272" font-size="13" font-weight="700" fill="#1B2A41" letter-spacing="1">GATE TO ENTER THE NEXT PHASE</text>
  <g font-size="12" fill="#1B2A41">
    <rect x="30" y="284" width="178" height="62" rx="6" fill="#E9E3D8"/>
    <text x="42" y="304">Demo live · 50 contacts</text>
    <text x="42" y="322">· first outreach sent</text>
    <text x="42" y="338" fill="#5B6B82">~3 wks in term (est.)</text>
    <rect x="232" y="284" width="178" height="62" rx="6" fill="#E9E3D8"/>
    <text x="244" y="304" font-weight="700">3 retainer clients</text>
    <text x="244" y="322" fill="#5B6B82">~10–14 wks (est.)</text>
    <rect x="434" y="284" width="178" height="62" rx="6" fill="#E9E3D8"/>
    <text x="446" y="304" font-weight="700">10 clients, or</text>
    <text x="446" y="322" font-weight="700">7 + 300 subscribers</text>
    <rect x="636" y="284" width="178" height="62" rx="6" fill="#E9E3D8"/>
    <text x="648" y="304">≥30% attach and</text>
    <text x="648" y="322">add-ons ≥20% of MRR</text>
    <text x="648" y="338" fill="#5B6B82">P4 entry: ~10 + partner</text>
    <rect x="838" y="284" width="178" height="62" rx="6" fill="#E9E3D8"/>
    <text x="850" y="304">Partner live with</text>
    <text x="850" y="322">≥2 clients</text>
    <text x="850" y="338" fill="#5B6B82">P5 entry: ~15 or waitlist</text>
  </g>

  <!-- skills row -->
  <text x="30" y="386" font-size="13" font-weight="700" fill="#1B2A41" letter-spacing="1">SKILLS BUILT (AFTER THE MANUAL RUN)</text>
  <g font-size="12" fill="#1B2A41">
    <text x="30" y="408">build-prospect-list</text>
    <text x="30" y="425">build-cold-campaign</text>
    <text x="30" y="442" fill="#5B6B82">(debug-loop, iterate-on-</text>
    <text x="30" y="459" fill="#5B6B82">screenshot → CLAUDE.md)</text>
    <text x="232" y="408">onboard-client</text>
    <text x="232" y="425">setup-crm-automations</text>
    <text x="232" y="442">setup-local-seo</text>
    <text x="232" y="459">ship-site · report-to-client</text>
    <text x="232" y="476" fill="#5B6B82">opt: rebuild-prospect-site,</text>
    <text x="232" y="493" fill="#5B6B82">write-loom-script</text>
    <text x="434" y="408">build-tender-feed</text>
    <text x="434" y="425">build-trades-report</text>
    <text x="636" y="408">produce-social-content</text>
    <text x="838" y="408">connect-books</text>
    <text x="1040" y="408" fill="#5B6B82">decided at entry</text>
  </g>

  <!-- adjust loops -->
  <g stroke="#E0782F" stroke-width="1.6" fill="none">
    <path d="M300,230 C300,262 360,262 360,234" marker-end="url(#ao)"/>
    <path d="M500,230 C500,262 560,262 560,234" marker-end="url(#ao)"/>
  </g>
  <g font-size="11" fill="#E0782F">
    <text x="232" y="524">↺ P1 adjust: 200 contacts OR universe exhausted (D2), 0 clients</text>
    <text x="232" y="540">→ change offer, price or trade, never the product</text>
    <text x="700" y="524">↺ P2 adjust: &lt;100 subscribers after 12 wks → monthly or stop</text>
  </g>
</svg>
