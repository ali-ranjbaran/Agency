<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0782F"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#F7F3EC"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A41">Arkosa · offer ladder and client journey</text>
  <text x="40" y="72" font-size="13" fill="#5B6B82">Prices are placeholders (see §5.2). Phase in the badge = when the offer becomes available.</text>

  <!-- LADDER -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#1B2A41" letter-spacing="1">OFFER LADDER</text>
  <g font-size="13">
    <!-- rows bottom (free) to top (later) -->
    <rect x="40" y="628" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#C9C2B6"/>
    <text x="56" y="652" font-weight="700" fill="#1B2A41">Free · Prairie Trades Report</text>
    <text x="56" y="672" fill="#5B6B82">Weekly email: tenders, costs, permits · opt-in only</text>
    <rect x="420" y="640" width="46" height="22" rx="11" fill="#5B6B82"/><text x="443" y="655" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P2</text>

    <rect x="40" y="560" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.5"/>
    <text x="56" y="584" font-weight="700" fill="#1B2A41">Entry · Website + Google Business Profile</text>
    <text x="56" y="604" fill="#5B6B82">$3,000 setup · 1 week · includes 30 days free automations</text>
    <rect x="420" y="572" width="46" height="22" rx="11" fill="#1B2A41"/><text x="443" y="587" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P1</text>

    <rect x="40" y="480" width="440" height="70" rx="6" fill="#1B2A41"/>
    <text x="56" y="505" font-weight="700" fill="#FFFFFF">Core · Never Miss a Job  (revenue engine)</text>
    <text x="56" y="524" fill="#D9DEE7">CRM · missed-call text-back · reviews · reactivation</text>
    <text x="56" y="541" fill="#F2B98C">$450/mo · setup $1,500 only if Core-direct (D5)</text>
    <rect x="420" y="492" width="46" height="22" rx="11" fill="#E0782F"/><text x="443" y="507" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P1</text>

    <rect x="40" y="412" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="56" y="436" font-weight="700" fill="#1B2A41">Add-on · Tender alerts pro</text>
    <text x="56" y="456" fill="#5B6B82">$79/mo · commercial-segment clients only (D6)</text>
    <rect x="420" y="424" width="46" height="22" rx="11" fill="#E0782F"/><text x="443" y="439" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P3</text>

    <rect x="40" y="344" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="56" y="368" font-weight="700" fill="#1B2A41">Add-on · Social content</text>
    <text x="56" y="388" fill="#5B6B82">$600/mo · monthly batch from their job photos</text>
    <rect x="420" y="356" width="46" height="22" rx="11" fill="#E0782F"/><text x="443" y="371" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P3</text>

    <rect x="40" y="276" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="56" y="300" font-weight="700" fill="#1B2A41">Add-on · Books + receipts (partner)</text>
    <text x="56" y="320" fill="#5B6B82">Partner-billed · Arkosa keeps 10–20%</text>
    <rect x="420" y="288" width="46" height="22" rx="11" fill="#E0782F"/><text x="443" y="303" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P4</text>

    <rect x="40" y="208" width="440" height="58" rx="6" fill="#FFFFFF" stroke="#C9C2B6" stroke-dasharray="5 4"/>
    <text x="56" y="232" font-weight="700" fill="#1B2A41">Later · Multi-page sites, L3 dashboards</text>
    <text x="56" y="252" fill="#5B6B82">Quoted</text>
    <rect x="420" y="220" width="46" height="22" rx="11" fill="#5B6B82"/><text x="443" y="235" fill="#fff" text-anchor="middle" font-size="11" font-weight="700">P5</text>

    <rect x="40" y="128" width="440" height="70" rx="6" fill="none" stroke="#C9C2B6" stroke-dasharray="3 4"/>
    <text x="56" y="150" font-weight="700" fill="#5B6B82">Candidates (not locked · §8.2 rubric)</text>
    <text x="56" y="169" fill="#5B6B82">Maintenance plans · text-to-pay · after-hours voice</text>
    <text x="56" y="186" fill="#5B6B82">answering · Local Services Ads setup</text>
  </g>
  <text x="40" y="712" font-size="12" fill="#5B6B82">Pillars: find work (tenders, social, report) · never miss it (Core) · get paid (books)</text>

  <!-- JOURNEY -->
  <text x="560" y="112" font-size="14" font-weight="700" fill="#1B2A41" letter-spacing="1">CLIENT JOURNEY</text>
  <g font-size="13">
    <rect x="560" y="130" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#1B2A41"/>
    <text x="700" y="151" text-anchor="middle" font-weight="700" fill="#1B2A41">Email + call (CASL list)</text>
    <text x="700" y="169" text-anchor="middle" fill="#5B6B82">Phone ~45% · email ~35%</text>

    <rect x="560" y="210" width="280" height="50" rx="6" fill="#E0782F"/>
    <text x="700" y="231" text-anchor="middle" font-weight="700" fill="#fff">Prospect calls demo number</text>
    <text x="700" y="249" text-anchor="middle" fill="#FFF1E6">hangs up → text arrives in ~10 s</text>

    <rect x="560" y="290" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#1B2A41"/>
    <text x="700" y="311" text-anchor="middle" font-weight="700" fill="#1B2A41">Discovery call → proposal</text>
    <text x="700" y="329" text-anchor="middle" fill="#5B6B82">one number · paid upfront</text>

    <rect x="560" y="370" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#1B2A41"/>
    <text x="700" y="391" text-anchor="middle" font-weight="700" fill="#1B2A41">Site live (week 1)</text>
    <text x="700" y="409" text-anchor="middle" fill="#5B6B82">qa-site PASS → ship-site</text>

    <rect x="560" y="450" width="280" height="50" rx="6" fill="#1B2A41"/>
    <text x="700" y="471" text-anchor="middle" font-weight="700" fill="#fff">30 days free automations</text>
    <text x="700" y="489" text-anchor="middle" fill="#D9DEE7">text-back + review requests</text>

    <rect x="560" y="530" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#E0782F" stroke-width="2"/>
    <text x="700" y="551" text-anchor="middle" font-weight="700" fill="#1B2A41">Day-25 report → conversion call</text>
    <text x="700" y="569" text-anchor="middle" fill="#5B6B82">measured · confirmed · estimated</text>

    <rect x="560" y="620" width="200" height="56" rx="6" fill="#1B2A41"/>
    <text x="660" y="643" text-anchor="middle" font-weight="700" fill="#fff">Core retainer</text>
    <text x="660" y="662" text-anchor="middle" fill="#F2B98C">from day 31</text>

    <rect x="900" y="530" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#C9C2B6" stroke-dasharray="5 4"/>
    <text x="1030" y="551" text-anchor="middle" font-weight="700" fill="#5B6B82">Declines</text>
    <text x="1030" y="569" text-anchor="middle" fill="#5B6B82">keeps site · automations off day 31</text>

    <rect x="900" y="620" width="260" height="56" rx="6" fill="#FFFFFF" stroke="#E0782F" stroke-width="1.5"/>
    <text x="1030" y="643" text-anchor="middle" font-weight="700" fill="#1B2A41">Month-3 review → add-on</text>
    <text x="1030" y="662" text-anchor="middle" fill="#5B6B82">matched to client signal (§8.4)</text>

    <rect x="900" y="290" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#1B2A41" stroke-dasharray="5 4"/>
    <text x="1030" y="311" text-anchor="middle" font-weight="700" fill="#1B2A41">Core-direct (has a site)</text>
    <text x="1030" y="329" text-anchor="middle" fill="#5B6B82">full setup fee · no free period</text>
  </g>
  <g stroke="#1B2A41" stroke-width="1.6" fill="none">
    <line x1="700" y1="180" x2="700" y2="206" marker-end="url(#a)"/>
    <line x1="700" y1="260" x2="700" y2="286" marker-end="url(#a)"/>
    <line x1="700" y1="340" x2="700" y2="366" marker-end="url(#a)"/>
    <line x1="700" y1="420" x2="700" y2="446" marker-end="url(#a)"/>
    <line x1="700" y1="500" x2="700" y2="526" marker-end="url(#a)"/>
    <line x1="660" y1="580" x2="660" y2="616" marker-end="url(#a)"/>
    <line x1="840" y1="315" x2="896" y2="315" marker-end="url(#a)"/>
    <path d="M1030,340 L1030,440 L880,440 L880,640 L764,640" marker-end="url(#a)"/>
