  <g stroke="#E0782F" stroke-width="1.6" fill="none">
    <line x1="840" y1="555" x2="896" y2="555" marker-end="url(#ao)" stroke-dasharray="4 3"/>
    <line x1="760" y1="660" x2="896" y2="660" marker-end="url(#ao)"/>
  </g>
  <text x="868" y="548" font-size="11" fill="#E0782F" text-anchor="middle">no</text>
  <text x="648" y="600" font-size="11" fill="#1B2A41" text-anchor="end">yes</text>
  <text x="560" y="712" font-size="12" fill="#5B6B82">Referral ask at every day-25 report: 2 names.</text>
</svg>
